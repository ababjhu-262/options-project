name: Collect NVDA Options Data

on:
  schedule:
    # Runs Monday-Friday at 10:00 PM UTC
    - cron: '0 22 * * 1-5'

  # Allows you to run it manually from GitHub
  workflow_dispatch:

permissions:
  contents: write

jobs:
  collect-options:

    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install yfinance pandas

      - name: Run options collection script
        run: |
          python scripts/download_options.py

      - name: Commit updated data
        run: |
          git config --global user.name "github-actions"
          git config --global user.email "github-actions@github.com"

          git add data/options/*.csv

          git diff --staged --quiet || git commit -m "Daily options data update"

          git push